openapi: 3.1.0
info:
  title: cre-command API
  version: 0.1.0
  description: |
    Commercial Real Estate intelligence, crawling & lead-generation control panel API.

    ## Authentication
    All authenticated endpoints require an opaque bearer token in the `Authorization` header:

    ```
    Authorization: Bearer <token>
    ```

    Tokens are obtained via `POST /api/auth/login`.

    ## Split-Phase MFA Login
    For users with MFA (TOTP) enabled, login is a two-step process.

    ### Phase 1: Initiate Login
    Submit email and password. If MFA is enabled, the server returns a challenge without issuing a session token.

    ### Phase 2: Submit MFA Code
    Resubmit credentials with `mfaChallengeId` and either `mfaCode` or `mfaRecoveryCode`.

    ### Rate Limiting
    - Login attempts: 10 requests per minute per IP
    - MFA verification: 5 requests per minute per IP

servers:
  - url: /api
    description: Local development server
  - url: https://api.cre-command.example.com
    description: Production

paths:
  /auth/login:
    post:
      operationId: login
      summary: Authenticate and obtain a session token
      description: |
        Phase 1 (no MFA): validates credentials and returns a session token.
        
        Phase 2 (MFA enabled): when `mfaRequired: true` is returned, resubmit
        the same credentials plus `mfaChallengeId` and either `mfaCode`
        or `mfaRecoveryCode`.

        Note: MFA verification can be performed here or via the stricter
        `/auth/login/mfa-verify` endpoint (recommended).
      tags:
        - auth
      security: []
      responses:
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 0
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  message: Too many requests, please retry later
                  code: RATE_LIMITED

  /auth/login/mfa-verify:
    post:
      operationId: mfaVerify
      summary: Submit MFA verification for an existing challenge
      description: |
        Dedicated MFA verification endpoint with a stricter rate limit.
        Accepts either a six-digit TOTP code or a one-time recovery code.
        Recovery codes are consumed on successful use and cannot be reused.
      tags:
        - auth
      security: []
      responses:
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 0
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  message: Too many requests, please retry later
                  code: RATE_LIMITED

  /auth/mfa/enroll:
    post:
      operationId: mfaEnroll
      summary: Start TOTP enrollment
      description: |
        Generates a TOTP secret and persists the pending enrollment with the
        secret encrypted at rest using AES-256-GCM.

        Returns the Base32 secret and an `otpauth://` provisioning URI.
        MFA remains disabled until `/auth/mfa/confirm` successfully verifies
        a TOTP code.
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 0
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  message: Too many requests, please retry later
                  code: RATE_LIMITED

  /auth/mfa/confirm:
    post:
      operationId: mfaConfirm
      summary: Complete TOTP enrollment
      description: |
        Verifies a six-digit TOTP code against the pending enrollment secret
        and activates MFA.
      tags:
        - auth
      security:
        - bearerAuth: []
      responses:
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 0
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  message: Too many requests, please retry later
                  code: RATE_LIMITED

  /audit-log:
    get:
      operationId: listAuditLog
      summary: Query the audit trail
      description: |
        Append-only record of security- and policy-relevant actions.
        Entries are returned newest first.
      tags:
        - audit
      security:
        - bearerAuth: []
      responses:
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 0
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  message: Too many requests, please retry later
                  code: RATE_LIMITED

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        deviceFingerprint:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Optional client identifier for fraud detection or session binding.

    AuditLogEntry:
      type: object
      required:
        - id
        - at
        - action
        - metadata
      properties:
        metadata:
          type: object
          additionalProperties: true
          description: |
            Action-specific metadata. Secrets and credentials must never be included.
            Common fields may include:
              - ip: string (client IP address)
              - userAgent: string (browser or client identifier)

    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - code
          properties:
            message:
              type: string
            code:
              type: string
              description: |
                Machine-readable error code.
                INVALID_CREDENTIALS: Wrong email or password.
                UNAUTHENTICATED: Missing or invalid bearer token.
                FORBIDDEN: Insufficient permissions.
                NOT_FOUND: Resource not found.
                VALIDATION_ERROR: Request validation failed.
                RATE_LIMITED: Too many requests.
                MFA_CHALLENGE_REQUIRED: MFA code submitted without challenge ID.
                INVALID_MFA_CHALLENGE: Challenge expired or consumed.
                INVALID_MFA_CODE: Wrong TOTP or recovery code.
                MFA_NOT_ENABLED: MFA verification requested but MFA is disabled.
                MFA_NOT_CONFIGURED: Required MFA encryption configuration is missing.
                MFA_NOT_ENROLLED: Confirmation attempted without pending enrollment.
                MFA_ALREADY_ENABLED: MFA is already active.
